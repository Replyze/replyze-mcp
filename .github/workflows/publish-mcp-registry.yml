name: Publish to MCP Registry

# Manual only: Actions → "Publish to MCP Registry" → Run workflow (on main).
# Publishes server.json to registry.modelcontextprotocol.io under the
# io.github.Replyze namespace. The workflow's OIDC token proves the repository
# belongs to the Replyze organization, so no secret is needed. See RELEASING.md.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

env:
  MCP_PUBLISHER_VERSION: 1.8.9
  MCP_PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # mcp-publisher login github-oidc; only this job gets it
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download mcp-publisher (checksum verified)
        run: |
          curl -fsSL --retry 3 -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher validate server.json
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish server.json
